name: catchbox-mail

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: quit
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change_me}
      POSTGRES_DB: quit_mail
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U quit -d quit_mail"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped
    deploy:
      resources:
        limits: { memory: 512M }

  redis:
    image: redis:7-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped
    deploy:
      resources:
        limits: { memory: 256M }

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY:-quit}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_KEY:-change_me}
    volumes:
      - miniodata:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  minio-init:
    image: minio/mc:latest
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 ${S3_ACCESS_KEY:-quit} ${S3_SECRET_KEY:-change_me} &&
      mc mb --ignore-existing local/catchbox-mail
      "

  api:
    build:
      context: ..
      dockerfile: infrastructure/docker/Dockerfile.api
    env_file: [../.env]
    environment:
      DATABASE_URL: postgres://quit:${POSTGRES_PASSWORD:-change_me}@postgres:5432/quit_mail
      REDIS_URL: redis://redis:6379
      STORE_DRIVER: s3
      S3_ENDPOINT: http://minio:9000
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
    restart: unless-stopped
    deploy:
      resources:
        limits: { memory: 512M }

  worker:
    build:
      context: ..
      dockerfile: infrastructure/docker/Dockerfile.worker
    env_file: [../.env]
    environment:
      DATABASE_URL: postgres://quit:${POSTGRES_PASSWORD:-change_me}@postgres:5432/quit_mail
      REDIS_URL: redis://redis:6379
      STORE_DRIVER: s3
      S3_ENDPOINT: http://minio:9000
      SELF_HOSTED_SMTP_HOST: postfix
    volumes:
      - ../infrastructure/dkim:/dkim:ro
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
    ports:
      - "10025:10025"
    restart: unless-stopped
    deploy:
      resources:
        limits: { memory: 512M }

  postfix:
    build:
      context: ..
      dockerfile: infrastructure/docker/Dockerfile.postfix
    ports:
      - "25:25"
    depends_on:
      - worker
    restart: unless-stopped

  web:
    build:
      context: ..
      dockerfile: infrastructure/docker/Dockerfile.web
    restart: unless-stopped
    deploy:
      resources:
        limits: { memory: 128M }

  caddy:
    image: caddy:2-alpine
    environment:
      APP_URL: ${APP_URL:-http://localhost}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddydata:/data
      - caddyconfig:/config
    depends_on:
      - web
      - api
    restart: unless-stopped

volumes:
  pgdata:
  miniodata:
  caddydata:
  caddyconfig:
