# Development dependencies only: run apps natively with `pnpm dev`.
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: quit
      POSTGRES_PASSWORD: quit
      POSTGRES_DB: quit_mail
    ports:
      - "5432:5432"
    volumes:
      - pgdata_dev:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: quit
      MINIO_ROOT_PASSWORD: quit-minio-secret
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - miniodata_dev:/data

volumes:
  pgdata_dev:
  miniodata_dev:
